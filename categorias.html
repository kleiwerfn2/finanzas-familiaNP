{% extends "base.html" %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🏷️ Gestión de Categorías</h4>
            </div>
            <div class="card-body">
                
                <!-- Formulario de Alta -->
                <form method="POST" class="d-flex gap-2 mb-4">
                    <input type="text" name="nombre" class="form-control" placeholder="Nombre de nueva categoría..." required>
                    <button type="submit" class="btn btn-success fw-bold">➕ Agregar</button>
                </form>

                <!-- Listado Actual -->
                <ul class="list-group">
                    {% for cat in categorias %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ cat.nombre }}
                        </li>
                    {% else %}
                        <li class="list-group-item text-muted text-center">No hay categorías registradas.</li>
                    {% endfor %}
                </ul>

            </div>
        </div>
    </div>
</div>
{% endblock %}
