{% extends "base.html" %}

{% block contenido %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    {{ '✏️ Editar Gasto Recurrente' if recurrente else '➕ Nuevo Gasto Recurrente' }}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Descripción</label>
                        <input type="text" 
                               name="descripcion" 
                               class="form-control" 
                               placeholder="Ej: Alquiler, Expensas, Netflix"
                               value="{{ recurrente.descripcion if recurrente else '' }}" 
                               required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Monto ($)</label>
                            <input type="number" 
                                   step="0.01" 
                                   name="monto" 
                                   class="form-control" 
                                   placeholder="0.00"
                                   value="{{ recurrente.monto if recurrente else '' }}" 
                                   required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Día de Vencimiento (1 a 31)</label>
                            <input type="number" 
                                   name="dia_vencimiento" 
                                   min="1" 
                                   max="31" 
                                   class="form-control" 
                                   placeholder="Ej: 10"
                                   value="{{ recurrente.dia_vencimiento if recurrente else '' }}" 
                                   required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Categoría</label>
                            <select name="categoria" class="form-select" required>
                                <option value="">Seleccionar...</option>
                                {% for cat in categorias %}
                                    <option value="{{ cat }}" {{ 'selected' if recurrente and recurrente.categoria == cat else '' }}>
                                        {{ cat }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Responsable</label>
                            <select name="responsable" class="form-select" required>
                                <option value="">Seleccionar...</option>
                                {% for resp in responsables %}
                                    <option value="{{ resp }}" {{ 'selected' if recurrente and recurrente.responsable == resp else '' }}>
                                        {{ resp }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Medio de Pago</label>
                            <select name="medio_pago" class="form-select" required>
                                <option value="">Seleccionar...</option>
                                {% for mp in medios_pago %}
                                    <option value="{{ mp }}" {{ 'selected' if recurrente and recurrente.medio_pago == mp else '' }}>
                                        {{ mp }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('listar_recurrentes') }}" class="btn btn-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            Guardar Gasto Recurrente
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
