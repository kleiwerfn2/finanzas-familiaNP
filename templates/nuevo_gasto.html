{% extends "base.html" %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

        <div class="card shadow-lg">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">💰 Registrar Gasto</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" name="fecha" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" name="descripcion" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monto</label>
                        <input type="number" step="0.01" class="form-control" name="monto" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría</label>

                        <select class="form-select" name="categoria" required>
                            <option value="">Seleccione...</option>
                            <option>Supermercado</option>
                            <option>Restaurante</option>
                            <option>Alquiler</option>
                            <option>Agua</option>
                            <option>Luz</option>
                            <option>Gas</option>
                            <option>Internet</option>
                            <option>Telefono</option>
                            <option>Educación</option>
                            <option>Deportes</option>
                            <option>Transporte</option>
                            <option>Salud</option>
                            <option>Vacaciones</option>
                            <option>Fondo de Retiro</option>
                            <option>Gastos Personales</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Responsable</label>

                        <select class="form-select" name="responsable" required>
                            <option value="">Seleccione...</option>
                            <option>Joffan</option>
                            <option>Dore</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Medio de Pago</label>

                        <select class="form-select" name="medio_pago" required>
                            <option value="">Seleccione...</option>
                            <option>BBVA Master</option>
                            <option>BBVA Visa</option>
                            <option>Santander Visa</option>
                            <option>Santander American</option>
                            <option>Transferencia Galicia</option>
                            <option>Transferencia Santander</option>
                            <option>Transferencia BBVA</option>
                            <option>Mercado Pago</option>
                            <option>Efectivo</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Guardar Gasto
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
