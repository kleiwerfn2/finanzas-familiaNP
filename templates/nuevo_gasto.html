{% extends "base.html" %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

        <div class="card shadow-lg">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    {% if gasto %}✏️ Editar Gasto{% else %}💰 Registrar Gasto{% endif %}
                </h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" name="fecha" value="{{ gasto.fecha if gasto else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" name="descripcion" value="{{ gasto.descripcion if gasto else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monto</label>
                        <input type="number" step="0.01" class="form-control" name="monto" value="{{ gasto.monto if gasto else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría</label>

                        <select class="form-select" name="categoria" required>
                            <option value="" disabled {% if not gasto %}selected{% endif %}>Seleccione...</option>
                            {% for cat in ["Supermercado", "Restaurante", "Alquiler", "Agua", "Luz", "Gas", "Internet", "Telefono", "Educación", "Deportes", "Transporte", "Salud", "Vacaciones", "Fondo de Retiro", "Gastos Personales"] %}
                                <option value="{{ cat }}" {% if gasto and gasto.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Responsable</label>

                        <select class="form-select" name="responsable" required>
                            <option value="" disabled {% if not gasto %}selected{% endif %}>Seleccione...</option>
                            {% for resp in ["Joffan", "Dore"] %}
                                <option value="{{ resp }}" {% if gasto and gasto.responsable == resp %}selected{% endif %}>{{ resp }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Medio de Pago</label>

                        <select class="form-select" name="medio_pago" required>
                            <option value="" disabled {% if not gasto %}selected{% endif %}>Seleccione...</option>
                            {% for mp in ["BBVA Master", "BBVA Visa", "Santander Visa", "Santander American", "Transferencia Galicia", "Transferencia Santander", "Transferencia BBVA", "Mercado Pago", "Efectivo"] %}
                                <option value="{{ mp }}" {% if gasto and gasto.medio_pago == mp %}selected{% endif %}>{{ mp }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            {% if gasto %}Guardar Cambios{% else %}Guardar Gasto{% endif %}
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
