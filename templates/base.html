<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Familia NP</title>

    <link rel="stylesheet"

    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.jsscript>

    <style>

        body{
            background-color:#f5f6fa;
        }

        .sidebar{
            min-height:100vh;
            background:#1e3a5f;
        }

        .sidebar .nav-link{
            color:white;
        }

        .sidebar .nav-link:hover{
            background:rgba(255,255,255,.15);
            border-radius:8px;
        }

        .content{
            padding:20px;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- MENU LATERAL -->

        <nav class="col-md-2 d-md-block sidebar collapse" id="sidebarMenu">

            <div class="pt-3 px-3">

                <h4 class="text-white">
                    💰 Finanzas
                </h4>

                <hr class="text-white">

                <ul class="nav flex-column">

                    <li class="nav-item">
                        <a class="nav_link" href="/">
                            🏠 Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav_link" href="/nuevo">
                            ➕ Nuevo Gasto
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav_link" href="/gastos">
                            📋 Gastos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav_link" href="/reportes">
                            📊 Reportes
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

        <!-- CONTENIDO -->

        <main class="col-md-10 ms-sm-auto content">

            <button
                class="btn btn-primary d-md-none mb-3"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#sidebarMenu">

                ☰ Menú

            </button>

            {% block contenido %}
            {% endblock %}

        </main>

    </div>

</div>

</body>
</html>
