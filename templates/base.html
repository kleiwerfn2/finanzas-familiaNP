    <!DOCTYPE html>
    <html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Finanzas Familia NP</title>

        <link rel="stylesheet"

    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        
        <style>

            .sidebar {
                width: 260px;
                min-height: 100vh;
                background: #1e3a5f;
                flex-shrink: 0;
                transition: all 0.3s ease;
            }

            .sidebar-colapsado {
                width: 70px;
            }

            .sidebar-colapsado .texto-menu {
                display: none;
            }

            .sidebar-colapsado #tituloSidebar {
                display: none;
            }

            .sidebar-colapsado .nav-link {
                text-align: center;
                font-size: 1.3rem;
            }

            .sidebar-colapsado .pt-3 {
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            body{
                background-color:#f5f6fa;
            }

            .sidebar .nav-link{
                color:white;
            }

            .sidebar .nav-link:hover{
                background:rgba(255,255,255,.15);
                border-radius:8px;
            }

            .content{
                flex:1;
                padding:20px;
                overflow-x:hidden;
            }

        </style>

    </head>
    <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <body>

    <script>

    function toggleSidebar() {

        const sidebar =
            document.getElementById("sidebarMenu");

        sidebar.classList.toggle("sidebar-colapsado");

    }

    </script>

    <div class="container-fluid">

        <div class="d-flex">

            <!-- MENU LATERAL -->

            <nav class="sidebar" id="sidebarMenu">

                <div class="pt-3 px-3">

                    <div class="d-flex align-items-center justify-content-between">

                        <h4
                            class="text-white mb-0 texto-menu"
                            id="tituloSidebar">

                            💰 Finanzas Familiares

                        </h4>

                        <button
                            class="btn btn-outline-light btn-sm"
                            onclick="toggleSidebar()"
                            title="Mostrar/Ocultar Menú">

                            ☰

                        </button>

                    </div>

                    <hr class="text-white">

                    <ul class="nav flex-column">

                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                🏠 <span class="texto-menu">Inicio</span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/nuevo">
                                ➕ <span class="texto-menu">Nuevo Gasto</span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/gastos">
                                📋 <span class="texto-menu">Gastos</span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/reportes">
                                📊 <span class="texto-menu">Reportes</span>
                            </a>
                        </li>

                    </ul>

                </div>

            </nav>

            <!-- CONTENIDO -->

            <main id="contenidoPrincipal" class="content">

                {% block contenido %}
                {% endblock %}

            </main>

        </div>

    </div>

    </body>
    </html>
