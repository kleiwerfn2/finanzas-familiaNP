<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Familia NP</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <style>
        body {
            background-color: #f5f6fa;
        }

        /* Estilos generales para el menú */
        .bg-custom-navy {
            background-color: #1e3a5f !important;
        }

        .offcanvas-custom {
            background-color: #1e3a5f;
            color: white;
            width: 280px !important;
        }

        .offcanvas-custom .nav-link {
            color: white;
            padding: 12px 15px;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .offcanvas-custom .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }

        .content {
            padding: 20px;
            overflow-x: hidden;
        }

        /* ============================================================
           AJUSTES RESPONSIVOS PARA PANTALLAS PEQUEÑAS (MÓVILES)
           ============================================================ */
        @media (max-width: 576px) {
            /* Aprovecha al máximo el ancho de la pantalla del iPhone */
            .content {
                padding: 10px !important;
            }

            /* Escala los títulos para que no rompan líneas ni ocupen mucho alto */
            h1, .h1 { font-size: 1.4rem !important; }
            h2, .h2 { font-size: 1.25rem !important; }
            h3, .h3 { font-size: 1.1rem !important; }
            h4, .h4, .navbar-brand { font-size: 1rem !important; }

            /* Compacta tablas, tarjetas y formularios en el contenido */
            .table {
                font-size: 0.85rem !important;
            }

            .card-body {
                padding: 0.75rem !important;
            }

            .btn {
                font-size: 0.875rem !important;
                padding: 0.375rem 0.65rem !important;
            }

            .form-control, .form-select, .form-label {
                font-size: 0.9rem !important;
            }
        }
    </style>
</head>

<body>

    <!-- BARRA SUPERIOR FIJA -->
    <nav class="navbar navbar-dark bg-custom-navy sticky-top shadow-sm py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-truncate" style="max-width: 80%;" href="{{ url_for('home') }}">
                💰 Finanzas Familiares
            </a>
            
            <!-- Botón Hamburguesa -->
            <button class="navbar-toggler border-0 p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuOffcanvas" aria-controls="menuOffcanvas" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- MENÚ DESPLEGABLE FLOTANTE (OFFCANVAS) -->
    <div class="offcanvas offcanvas-start offcanvas-custom" tabindex="-1" id="menuOffcanvas" aria-labelledby="menuOffcanvasLabel">
        
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title fw-bold" id="menuOffcanvasLabel">
                💰 Finanzas Familiares
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>

        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item mb-1">
                    <a class="nav-link" href="{{ url_for('home') }}">
                        🏠 <span class="ms-2">Inicio</span>
                    </a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link" href="{{ url_for('nuevo_gasto') }}">
                        ➕ <span class="ms-2">Nuevo Gasto</span>
                    </a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link" href="{{ url_for('listar_gastos') }}">
                        📋 <span class="ms-2">Gastos</span>
                    </a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link" href="{{ url_for('reportes') }}">
                        📊 <span class="ms-2">Reportes</span>
                    </a>
                </li>
                <li class="nav-item mb-1">
                    <a class="nav-link" href="{{ url_for('listar_recurrentes') }}">
                        🔁 <span class="ms-2">Recurrentes</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="contenidoPrincipal" class="content container-fluid">
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- Botón Flotante de Carga Rápida (Solo visible en móviles/tablets) -->
    <a href="{{ url_for('carga_rapida') }}" 
       class="btn btn-success rounded-circle position-fixed bottom-0 end-0 m-3 shadow-lg d-md-none d-flex align-items-center justify-content-center" 
       style="width: 52px; height: 52px; font-size: 24px; z-index: 1050; text-decoration: none;">
        ⚡
    </a>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
